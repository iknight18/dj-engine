[package]
name = "dj_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "dj-engine"
path = "src/main.rs"

[lib]
name = "dj_engine"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
ringbuf = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
walkdir = "2.5"
byteorder = "1.5"
parking_lot = "0.12"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.39", features = ["test-util", "macros"] }
